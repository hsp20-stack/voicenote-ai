<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceNote AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b1329] text-white min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-[#0b1329]/90 px-4 py-3 flex items-center justify-between sticky top-0 z-20">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-xl bg-sky-600 flex items-center justify-center font-bold">🎙️</div>
      <span class="font-extrabold text-base tracking-tight">VoiceNote AI</span>
      <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/30">ONLINE</span>
    </div>
    <div class="flex items-center gap-2">
      <button id="settingsBtn" type="button" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-sky-400 text-xs font-semibold" title="Configurar clave Gemini">⚙️ Clave IA</button>
      <button id="clearBtn" type="button" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs" title="Nueva charla">➕ Limpiar</button>
    </div>
  </header>

  <!-- Feed de Chat -->
  <main class="flex-1 max-w-3xl w-full mx-auto p-4 flex flex-col justify-between overflow-hidden">
    <div id="chatMessages" class="flex-1 overflow-y-auto space-y-4 pb-4">
      <div id="welcome" class="text-center py-12 space-y-3">
        <div class="text-6xl animate-bounce">🤖</div>
        <h2 class="text-2xl font-bold">¡Hola! Soy VoiceNote AI</h2>
        <p class="text-slate-400 text-sm max-w-sm mx-auto">Pregúntame cualquier duda, pídele redacciones, historias, recetas o preguntas complejas. Te responderé al detalle con voz.</p>
      </div>
    </div>

    <!-- Barra de Entrada -->
    <div class="pt-2">
      <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 rounded-2xl p-2 shadow-xl focus-within:border-sky-500">
        <button id="micBtn" type="button" class="w-10 h-10 rounded-xl bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center text-lg">🎤</button>
        <input type="text" id="chatInput" placeholder="Hazme cualquier pregunta, incluso compleja..." autocomplete="off" class="flex-1 bg-transparent px-2 text-sm text-white focus:outline-none">
        <button id="sendBtn" type="button" class="w-10 h-10 rounded-xl bg-sky-600 hover:bg-sky-500 text-white flex items-center justify-center font-bold">⬆️</button>
      </div>
      <p class="text-center text-[11px] text-slate-500 mt-2">Desarrollada por Hugo SP Studios</p>
    </div>
  </main>

  <!-- Modal Ajustes Clave Gemini -->
  <div id="settingsModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-sm w-full space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-sm">Clave de Google Gemini (Opcional)</h3>
        <button id="closeSettings" class="text-slate-400 hover:text-white text-lg">✕</button>
      </div>
      <p class="text-xs text-slate-400">Si tienes una clave de Gemini puedes guardarla aquí:</p>
      <input type="text" id="apiKeyInput" placeholder="Pega tu clave aquí..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:border-sky-500 outline-none">
      <div class="flex justify-between items-center text-[11px]">
        <span id="keyStatus" class="text-emerald-400 font-semibold"></span>
      </div>
      <button id="saveKeyBtn" class="w-full py-2 bg-sky-600 hover:bg-sky-500 rounded-xl font-bold text-xs">Guardar Clave</button>
    </div>
  </div>

  <script>
    const state = {
      apiKey: localStorage.getItem('gemini_key') || '',
      isProcessing: false,
      isSpeaking: false,
      recog: null
    };

    function speak(text) {
      if (!('speechSynthesis' in window) || !text) return;
      
      // Cancelar voz y matar micro para que NUNCA escuche al altavoz
      window.speechSynthesis.cancel();
      if (state.recog) {
        try { state.recog.abort(); } catch(e) {}
      }
      state.isSpeaking = true;

      const clean = text.replace(/[*_#•`\\]/g, '').slice(0, 350);
      const ut = new SpeechSynthesisUtterance(clean);
      ut.lang = 'es-ES';
      ut.rate = 0.95;

      const voices = window.speechSynthesis.getVoices();
      const v = voices.find(x => x.lang.startsWith('es'));
      if (v) ut.voice = v;

      // Al terminar de hablar, dejamos 600ms de silencio antes de admitir nuevo audio
      ut.onend = () => {
        setTimeout(() => { state.isSpeaking = false; }, 600);
      };
      ut.onerror = () => {
        state.isSpeaking = false;
      };

      window.speechSynthesis.speak(ut);
    }

    function getFastAnswer(q) {
      const clean = q.toLowerCase().trim();

      // Cálculos matemáticos
      const mathClean = clean.replace(/cuánto es|cuanto es|calcula|calcular/i, '').trim();
      const mathMatch = mathClean.match(/^([\d.,\s+\-*/()^]+)$/);
      if (mathMatch) {
        try {
          const sanitized = mathMatch[1].replace(/,/g, '.');
          const res = Function(`'use strict'; return (${sanitized})`)();
          if (typeof res === 'number' && !isNaN(res)) {
            return `El resultado es **${res}**.`;
          }
        } catch (e) {}
      }

      if (/^(hola|buenas|buenos dias|buenas tardes|hey|que tal|qué tal)$/i.test(clean)) {
        return "¡Hola! Estoy listo para responderte a cualquier pregunta, sea sencilla o muy elaborada. ¿De qué te gustaría hablar?";
      }

      if (/^(qué hora es|que hora es|hora actual)$/i.test(clean)) {
        const now = new Date();
        return `Son las **${now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}**.`;
      }
      if (/^(qué día es|que dia es|fecha de hoy)$/i.test(clean)) {
        const now = new Date();
        const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        return `Hoy es **${now.toLocaleDateString('es-ES', opciones)}**.`;
      }

      return null;
    }

    // Motor IA Generativa Potente (Hasta 30 segundos para preguntas complejas y elaboradas)
    async function queryGenerativeAI(q) {
      const prompt = `Eres VoiceNote AI desarrollado por Hugo SP Studios. Responde siempre en español de España de forma completa, detallada y útil a la siguiente consulta del usuario: ${q}`;
      
      // Intento 1 con openai-fast
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 30000);
        const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai-fast`, {
          signal: ctrl.signal
        });
        clearTimeout(timer);
        if (res.ok) {
          const text = await res.text();
          if (text && text.trim().length > 10 && !text.includes('Rate limit')) {
            return text.trim();
          }
        }
      } catch (e) {}

      // Intento 2 con modelo estándar
      try {
        const ctrl2 = new AbortController();
        const timer2 = setTimeout(() => ctrl2.abort(), 20000);
        const res2 = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`, {
          signal: ctrl2.signal
        });
        clearTimeout(timer2);
        if (res2.ok) {
          const text2 = await res2.text();
          if (text2 && text2.trim().length > 10 && !text2.includes('Rate limit')) {
            return text2.trim();
          }
        }
      } catch (e) {}

      return null;
    }

    // Motor Enciclopedia Avanzado (Búsqueda por texto completo)
    async function searchEncyclopedia(q) {
      try {
        const searchUrl = `https://es.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&utf8=&format=json&origin=*`;
        const res = await fetch(searchUrl);
        if (res.ok) {
          const data = await res.json();
          const firstResult = data.query?.search?.[0];
          if (firstResult && firstResult.snippet) {
            const cleanSnippet = firstResult.snippet.replace(/<[^>]+>/g, '');
            return `**${firstResult.title}**:\n${cleanSnippet}...`;
          }
        }
      } catch (e) {}
      return null;
    }

    async function askAI(q) {
      const cleanQ = q.trim();

      // 1. Respuesta ultrarrápida (saludos / cálculos)
      const fast = getFastAnswer(cleanQ);
      if (fast) return fast;

      // 2. Clave Gemini (si está configurada)
      if (state.apiKey) {
        try {
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${encodeURIComponent(state.apiKey.trim())}`;
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-goog-api-key': state.apiKey.trim()
            },
            body: JSON.stringify({
              contents: [{
                parts: [{ text: `Eres VoiceNote AI de Hugo SP Studios. Responde en español de España de forma útil, detallada y completa a: ${cleanQ}` }]
              }]
            })
          });

          if (res.ok) {
            const data = await res.json();
            const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (reply) return reply;
          }
        } catch (e) {}
      }

      // 3. IA Generativa Libre (Resuelve preguntas complejas y elaboradas)
      const gen = await queryGenerativeAI(cleanQ);
      if (gen) return gen;

      // 4. Enciclopedia por búsqueda
      const enc = await searchEncyclopedia(cleanQ);
      if (enc) return enc;

      return `He procesado tu pregunta sobre "${cleanQ}". ¿Podrías indicarme algún detalle más específico para darte una mejor respuesta?`;
    }

    function appendMessage(sender, text) {
      const welcome = document.getElementById('welcome');
      if (welcome) welcome.remove();

      const box = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = sender === 'user' ? 'flex justify-end' : 'flex justify-start';

      const bg = sender === 'user' ? 'bg-sky-600 text-white' : 'bg-slate-900 border border-slate-800 text-slate-200';
      div.innerHTML = `
        <div class="max-w-[85%] p-3 rounded-2xl ${bg} text-sm whitespace-pre-wrap leading-relaxed shadow">
          ${text.replace(/\n/g, '<br>')}
        </div>
      `;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    async function handleSend() {
      if (state.isProcessing || state.isSpeaking) return;

      const input = document.getElementById('chatInput');
      const q = input.value.trim();
      if (!q) return;

      state.isProcessing = true;

      // Abortar micrófono de inmediato
      if (state.recog) {
        try { state.recog.abort(); } catch(e) {}
        const micBtn = document.getElementById('micBtn');
        if (micBtn) micBtn.textContent = '🎤';
      }

      appendMessage('user', q);
      input.value = '';

      const box = document.getElementById('chatMessages');
      const thinkDiv = document.createElement('div');
      thinkDiv.id = 'thinking';
      thinkDiv.className = 'text-xs text-sky-400 animate-pulse';
      thinkDiv.textContent = '🤖 Pensando y redactando respuesta...';
      box.appendChild(thinkDiv);
      box.scrollTop = box.scrollHeight;

      try {
        const reply = await askAI(q);
        const el = document.getElementById('thinking');
        if (el) el.remove();

        appendMessage('ai', reply);
        speak(reply);
      } finally {
        state.isProcessing = false;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      const micBtn = document.getElementById('micBtn');
      const clearBtn = document.getElementById('clearBtn');
      const settingsBtn = document.getElementById('settingsBtn');
      const settingsModal = document.getElementById('settingsModal');
      const closeSettings = document.getElementById('closeSettings');
      const saveKeyBtn = document.getElementById('saveKeyBtn');
      const apiKeyInput = document.getElementById('apiKeyInput');
      const keyStatus = document.getElementById('keyStatus');

      sendBtn.addEventListener('click', (e) => {
        e.preventDefault();
        handleSend();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleSend();
        }
      });

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        state.recog = new SpeechRecognition();
        state.recog.lang = 'es-ES';
        
        state.recog.onresult = (e) => {
          // Bloqueo total: si la IA está pensando o hablando por altavoz, NUNCA procesar
          if (state.isProcessing || state.isSpeaking || window.speechSynthesis.speaking) {
            return;
          }
          const text = e.results[0][0].transcript;
          if (text && text.trim().length > 0) {
            input.value = text;
            handleSend();
          }
        };

        micBtn.addEventListener('click', () => {
          if (state.isSpeaking || window.speechSynthesis.speaking) {
            window.speechSynthesis.cancel();
            state.isSpeaking = false;
          }
          try {
            state.recog.start();
            micBtn.textContent = '🔴';
          } catch (e) {
            state.recog.abort();
            micBtn.textContent = '🎤';
          }
        });

        state.recog.onend = () => { micBtn.textContent = '🎤'; };
      }

      clearBtn.addEventListener('click', () => location.reload());

      settingsBtn.addEventListener('click', () => {
        apiKeyInput.value = state.apiKey;
        keyStatus.textContent = state.apiKey ? '✓ Clave guardada' : '';
        keyStatus.className = 'text-emerald-400 font-semibold';
        settingsModal.classList.remove('hidden');
      });
      closeSettings.addEventListener('click', () => settingsModal.classList.add('hidden'));

      saveKeyBtn.addEventListener('click', async () => {
        const k = apiKeyInput.value.trim();
        if (!k) {
          state.apiKey = '';
          localStorage.removeItem('gemini_key');
          keyStatus.textContent = 'Sin clave';
          setTimeout(() => settingsModal.classList.add('hidden'), 500);
          return;
        }

        state.apiKey = k;
        localStorage.setItem('gemini_key', k);
        keyStatus.textContent = '✓ ¡Clave guardada con éxito!';
        keyStatus.className = 'text-emerald-400 font-semibold';
        setTimeout(() => settingsModal.classList.add('hidden'), 700);
      });
    });
  </script>
</body>
</html>
