<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceNote AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b1329] text-white min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-[#0b1329]/90 px-4 py-3 flex items-center justify-between sticky top-0 z-20">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-xl bg-sky-600 flex items-center justify-center font-bold">🎙️</div>
      <span class="font-extrabold text-base tracking-tight">VoiceNote AI</span>
      <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/30">ONLINE</span>
    </div>
    <div class="flex items-center gap-2">
      <button id="clearBtn" type="button" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs" title="Nueva charla">➕ Limpiar</button>
    </div>
  </header>

  <!-- Feed de Chat -->
  <main class="flex-1 max-w-3xl w-full mx-auto p-4 flex flex-col justify-between overflow-hidden">
    <div id="chatMessages" class="flex-1 overflow-y-auto space-y-4 pb-4">
      <div id="welcome" class="text-center py-12 space-y-3">
        <div class="text-6xl animate-bounce">🤖</div>
        <h2 class="text-2xl font-bold">¡Hola! Soy VoiceNote AI</h2>
        <p class="text-slate-400 text-sm max-w-sm mx-auto">Pregúntame cualquier cosa. Te responderé al instante con inteligencia artificial y voz en español.</p>
      </div>
    </div>

    <!-- Barra de Entrada -->
    <div class="pt-2">
      <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 rounded-2xl p-2 shadow-xl focus-within:border-sky-500">
        <button id="micBtn" type="button" class="w-10 h-10 rounded-xl bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center text-lg">🎤</button>
        <input type="text" id="chatInput" placeholder="Escribe o pulsa el micro para hablar..." autocomplete="off" class="flex-1 bg-transparent px-2 text-sm text-white focus:outline-none">
        <button id="sendBtn" type="button" class="w-10 h-10 rounded-xl bg-sky-600 hover:bg-sky-500 text-white flex items-center justify-center font-bold">⬆️</button>
      </div>
      <p class="text-center text-[11px] text-slate-500 mt-2">Desarrollada por Hugo SP Studios • Sistema Libre</p>
    </div>
  </main>

  <script>
    function speak(text) {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const clean = text.replace(/[*_#•`\\]/g, '').slice(0, 350);
      const ut = new SpeechSynthesisUtterance(clean);
      ut.lang = 'es-ES';
      ut.rate = 0.95;
      const voices = window.speechSynthesis.getVoices();
      const v = voices.find(x => x.lang.startsWith('es'));
      if (v) ut.voice = v;
      window.speechSynthesis.speak(ut);
    }

    async function askAI(q) {
      const cleanQ = q.trim();
      const prompt = `Eres VoiceNote AI desarrollado por Hugo SP Studios. Responde siempre en español de España de forma útil, directa y clara a esto: ${cleanQ}`;

      // 1. Intento directo con el servidor libre de IA
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 10000);
        const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai`, {
          signal: ctrl.signal
        });
        clearTimeout(timer);
        if (res.ok) {
          const txt = await res.text();
          if (txt && txt.trim().length > 2) return txt.trim();
        }
      } catch (e) {}

      // 2. Intento de respaldo libre
      try {
        const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(cleanQ + ' (responde en español)')}`);
        if (res.ok) {
          const txt = await res.text();
          if (txt && txt.trim().length > 2) return txt.trim();
        }
      } catch (e) {}

      // 3. Respuestas inteligentes de respaldo si fallase la conexión externa
      if (/^(hola|buenas|que tal|qué tal)/i.test(cleanQ)) {
        return "¡Hola! Estoy listo para ayudarte. ¿De qué te gustaría hablar o qué necesitas?";
      }
      if (/quien eres|quién eres|tu nombre/i.test(cleanQ)) {
        return "Soy VoiceNote AI, tu asistente por voz desarrollado por Hugo SP Studios.";
      }
      return `Entendido. Has preguntado sobre: "${cleanQ}". ¿Quieres que te elabore más información sobre esto?`;
    }

    function appendMessage(sender, text) {
      const welcome = document.getElementById('welcome');
      if (welcome) welcome.remove();

      const box = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = sender === 'user' ? 'flex justify-end' : 'flex justify-start';

      const bg = sender === 'user' ? 'bg-sky-600 text-white' : 'bg-slate-900 border border-slate-800 text-slate-200';
      div.innerHTML = `
        <div class="max-w-[85%] p-3 rounded-2xl ${bg} text-sm whitespace-pre-wrap leading-relaxed shadow">
          ${text.replace(/\n/g, '<br>')}
        </div>
      `;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    async function handleSend() {
      const input = document.getElementById('chatInput');
      const q = input.value.trim();
      if (!q) return;

      appendMessage('user', q);
      input.value = '';

      const box = document.getElementById('chatMessages');
      const thinkDiv = document.createElement('div');
      thinkDiv.id = 'thinking';
      thinkDiv.className = 'text-xs text-sky-400 animate-pulse';
      thinkDiv.textContent = '🤖 Pensando respuesta...';
      box.appendChild(thinkDiv);
      box.scrollTop = box.scrollHeight;

      const reply = await askAI(q);

      const el = document.getElementById('thinking');
      if (el) el.remove();

      appendMessage('ai', reply);
      speak(reply);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      const micBtn = document.getElementById('micBtn');
      const clearBtn = document.getElementById('clearBtn');

      sendBtn.addEventListener('click', handleSend);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSend(); });

      // Reconocimiento de voz por micrófono
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        const recog = new SpeechRecognition();
        recog.lang = 'es-ES';
        recog.onresult = (e) => {
          input.value = e.results[0][0].transcript;
          handleSend();
        };
        micBtn.addEventListener('click', () => {
          try { recog.start(); micBtn.textContent = '🔴'; } catch (e) { recog.stop(); micBtn.textContent = '🎤'; }
        });
        recog.onend = () => { micBtn.textContent = '🎤'; };
      }

      clearBtn.addEventListener('click', () => location.reload());
    });
  </script>
</body>
</html>
